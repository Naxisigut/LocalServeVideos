<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b1220;
        --ink: #f8fafc;
        --accent: #38bdf8;
        --font-display: "Inter", "Segoe UI", system-ui, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--font-display);
        background:
          radial-gradient(ellipse at 30% 20%, rgba(56, 189, 248, 0.18), transparent 55%),
          radial-gradient(ellipse at 70% 80%, rgba(99, 102, 241, 0.16), transparent 50%),
          var(--ground);
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px;
      }
      #eyebrow {
        color: var(--accent);
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        align-items: flex-end;
        padding-bottom: 620px;
      }
      #title {
        color: var(--ink);
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      #subtitle {
        color: rgba(248, 250, 252, 0.72);
        font-size: 36px;
        font-weight: 400;
        letter-spacing: -0.01em;
        align-items: flex-start;
        padding-top: 620px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <p id="eyebrow" class="clip" data-start="0" data-duration="4" data-track-index="0">
        LocalServe
      </p>
      <h1 id="title" class="clip" data-start="0" data-duration="4" data-track-index="1">
        Product Demo Videos
      </h1>
      <p id="subtitle" class="clip" data-start="0" data-duration="4" data-track-index="2">
        HyperFrames placeholder · 1920×1080
      </p>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      timeline.fromTo(
        "#eyebrow",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.15,
      );
      timeline.fromTo(
        "#title",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.35,
      );
      timeline.fromTo(
        "#subtitle",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.7,
      );
      window.__timelines.main = timeline;
      timeline.seek(0);
    </script>
  </body>
</html>
